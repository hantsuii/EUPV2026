<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Available Stock Analysis</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="tool-wrap">
    <header class="hero">
      <h1>Available Stock Analysis</h1>
      <p>Upload inventory and optional files, then generate and download the stock output workbook.</p>
    </header>

    <section class="panel">
      <h2>File Upload</h2>
      <p class="tip">Template is fixed to repository file: <code>./templates/stock_template.xlsx</code>.</p>
      <div class="form-grid">
        <div>
          <label for="inventoryFile">Inventory Step1 file (Required)</label>
          <input id="inventoryFile" type="file" accept=".xlsx,.xlsm,.xls" />
        </div>
        <div>
          <label for="dailySupplyFile">DailySupplyPlan (Optional)</label>
          <input id="dailySupplyFile" type="file" accept=".xlsx,.xlsm,.xls" />
        </div>
        <div>
          <label for="odpMasterFile">EUPV ODP MASTER (Optional)</label>
          <input id="odpMasterFile" type="file" accept=".xlsx,.xlsm,.xls" />
        </div>
        <div>
          <label for="orderFile">Orderfile_Base_Realtime (Optional)</label>
          <input id="orderFile" type="file" accept=".xlsx,.xlsm,.xls" />
        </div>
        <div>
          <label for="transitStart">Transit Start</label>
          <input id="transitStart" type="date" value="2026-08-01" />
        </div>
        <div>
          <label for="transitEnd">Transit End</label>
          <input id="transitEnd" type="date" value="2026-12-31" />
        </div>
      </div>

      <div class="actions">
        <button id="runBtn" class="btn-primary">Generate Stock File</button>
        <button id="resetBtn" class="btn-secondary" type="button">Reset</button>
        <a class="btn-link" href="./index.html">Back to Home</a>
      </div>
    </section>

    <section class="panel">
      <h2>Run Status</h2>
      <div id="status" class="status">Waiting to run...</div>
      <a id="downloadLink" class="download-link" style="display:none;" download>Download generated file</a>
    </section>
  </main>

  <script type="module" src="./available-stock-analysis.js"></script>
</body>
</html>
