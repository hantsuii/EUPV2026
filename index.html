<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business Analytics Portal</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1 id="portal-title">Business Analytics Portal</h1>
      <p id="portal-subtitle">Choose a module to open the analysis page.</p>
    </header>

    <section>
      <h2>Modules</h2>
      <div id="module-grid" class="grid"></div>
    </section>

    <section class="note">
      <h3>Usage Notes</h3>
      <ul>
        <li>Clicking an external module opens another website.</li>
        <li>Internal modules include a "Back to Home" button.</li>
        <li>To add or update modules, edit <code>modules.json</code>.</li>
      </ul>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
