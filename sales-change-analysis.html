<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>销售分析看板（PV/ESS）</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body.light-ui {
      --line-1: #c8d9f2;
      --line-2: #aac5ec;
      --text-1: #16345f;
      --text-2: #2f4f7d;
      --text-3: #56739f;
      --brand: #3f8bff;
      --brand-strong: #2f74db;
      background:
        radial-gradient(1200px 520px at 50% -12%, rgba(107, 180, 255, 0.28), rgba(232, 242, 255, 0) 72%),
        linear-gradient(180deg, #f7fbff 0%, #edf5ff 52%, #eaf3ff 100%);
    }
    .tool-wrap { max-width: 1360px; }
    .hero {
      margin-bottom: 14px;
      border: 1px solid #c9ddf7;
      background: linear-gradient(180deg, #ffffff 0%, #f4f9ff 100%);
      box-shadow: 0 10px 24px rgba(52, 97, 161, 0.1);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .panel {
      border: 1px solid #c9ddf7;
      box-shadow: 0 8px 20px rgba(52, 97, 161, 0.08);
      background: linear-gradient(180deg, #ffffff 0%, #f3f8ff 100%);
      border-radius: 14px;
      padding: 16px 18px;
    }

    .hero p,
    .tip,
    .mini-tip { color: #4f6f9d; }

    input[type="file"],
    input[type="text"],
    .status {
      background: #ffffff;
      color: #2a4d7a;
      border-color: #c5d9f4;
    }
    input[type="file"]::file-selector-button {
      background: #dcecff;
      color: #255488;
    }
    .btn-link {
      background: #edf4ff;
      color: #28517f;
    }
    .btn-link:hover {
      background: #dceafa;
    }

    .source-choice {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .source-choice label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-2);
    }
    .repo-row {
      margin-top: 8px;
      display: none;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .repo-row.active { display: flex; }
    .repo-row input[type="text"] {
      min-width: 360px;
      flex: 1;
      border: 1px solid var(--line-1);
      border-radius: 10px;
      padding: 10px;
    }
    .mini-tip { font-size: 12px; margin-top: 6px; }

    .jump-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .jump-btn {
      background: #e3efff;
      color: #28507d;
      border: 1px solid #bdd4f3;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 700;
    }
    .jump-btn:hover,
    .jump-btn.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .content-block { display: none; }
    .content-block.active { display: block; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .kpi-card {
      background: linear-gradient(180deg, #ffffff 0%, #f6faff 100%);
      border: 1px solid #cddff6;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 6px 16px rgba(76, 124, 185, 0.1);
    }
    .kpi-name { color: #5e7ea9; font-size: 13px; margin-bottom: 6px; }
    .kpi-value { font-size: 29px; font-weight: 700; color: #1e4672; }

    .chart-box {
      margin-top: 10px;
      border: 1px solid #cfe0f6;
      border-radius: 12px;
      padding: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }
    .chart { width: 100%; height: 380px; }

    .table-wrap {
      overflow: auto;
      border: 1px solid #cfe0f6;
      border-radius: 12px;
      margin-top: 10px;
      max-height: 420px;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      background: #fff;
      color: #2a4d7a;
    }
    th, td {
      border-bottom: 1px solid #e4eefb;
      padding: 8px 10px;
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #f3f8ff;
      position: sticky;
      top: 0;
      z-index: 1;
      color: #2a4d7a;
    }

    .region-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .region-card {
      background: #fff;
      border: 1px solid #cfe0f6;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 6px 14px rgba(76, 124, 185, 0.1);
      min-height: 174px;
    }
    .region-title {
      font-size: 20px;
      font-weight: 800;
      color: #1f4a7a;
      margin: 0 0 8px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      border-bottom: 1px dashed #e1ecfa;
      font-size: 13px;
      color: #3f608c;
    }
    .metric-row:last-child { border-bottom: 0; }
    .metric-label { color: #5f7da6; }
    .metric-value { font-weight: 700; color: #1f4a7a; }

    @media (max-width: 920px) {
      .repo-row input[type="text"] { min-width: 100%; }
    }
  </style>
</head>
<body class="light-ui">
  <main class="tool-wrap">
    <header class="hero">
      <h1>销售分析看板（PV / ESS）</h1>
      <p>统一库存分析模块风格，展示 2026 年至今总览与各区域看板。</p>
    </header>

    <section class="panel">
      <div class="actions">
        <a class="btn-link" href="./index.html">← Back to Home</a>
      </div>

      <div style="margin-top:10px;">
        <label>Sales Workbook Source</label>
        <div class="source-choice">
          <label><input type="radio" name="salesSource" value="upload" checked /> 上传本地文件</label>
          <label><input type="radio" name="salesSource" value="repo" /> 使用 GitHub 仓库文件</label>
        </div>

        <div id="uploadRow" class="form-grid" style="margin-top:6px;">
          <div>
            <label for="salesFile">Upload Sales Workbook (.xlsx)</label>
            <input id="salesFile" type="file" accept=".xlsx,.xls" />
          </div>
        </div>

        <div id="repoRow" class="repo-row">
          <div style="flex:1; min-width:360px;">
            <label for="repoSalesPath">Repository file path</label>
            <input id="repoSalesPath" type="text" value="./templates/sales_workbook.xlsx" placeholder="./templates/sales_workbook.xlsx" />
            <div class="mini-tip">例如：<code>./templates/sales_workbook.xlsx</code></div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="runBtn" class="btn btn-primary">Run Analysis</button>
      </div>
      <div id="status" class="status">请选择文件来源并点击 Run Analysis。</div>
    </section>

    <section class="panel">
      <div class="jump-wrap" id="jumpWrap">
        <button class="jump-btn active" data-target="block-total">总计 Dashboard</button>
        <button class="jump-btn" data-target="block-region">各地区看板</button>
      </div>

      <div id="block-total" class="content-block active">
        <h3>2026年总览</h3>
        <div id="totalKpiGrid" class="kpi-grid"></div>
        <div class="table-wrap"><table id="periodTable"></table></div>
        <div class="chart-box"><div id="monthlyTrendChart" class="chart"></div></div>
        <div class="chart-box"><div id="monthlyAspChart" class="chart"></div></div>
      </div>

      <div id="block-region" class="content-block">
        <h3>各地区看板（总览 + 组件/储能销售明细）</h3>
        <div id="regionGrid" class="region-grid"></div>
      </div>
    </section>
  </main>

  <script src="./sales-change-analysis.js"></script>
</body>
</html>
