<!doctype html>
<html><body style="margin:0"><iframe id="page" src="./forecast-sales-analysis.html" style="width:100%;height:100vh;border:0"></iframe>
<script>
const page = document.getElementById("page");
page.addEventListener("load", async () => {
  const doc = page.contentDocument;
  const load = async (url, name, input) => {
    const blob = await fetch(url).then((response) => response.blob());
    const transfer = new page.contentWindow.DataTransfer();
    transfer.items.add(new page.contentWindow.File([blob], name, { type:blob.type }));
    doc.getElementById(input).files = transfer.files;
  };
  await Promise.all([
    load("../../validation-data/forecast.xlsx", "forecast.xlsx", "forecastFile"),
    load("../../validation-data/sales.xlsx", "sales.xlsx", "salesFile"),
  ]);
  doc.getElementById("runBtn").click();
});
</script></body></html>
